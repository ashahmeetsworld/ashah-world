name: Orbit comment bot

# Comment ORBIT on an Instagram post -> the Orbit link arrives by DM and the comment is hidden.
# Script: scripts/orbit-dm/bot.py. Needs the repo secret IG_ACCESS_TOKEN.
on:
  schedule:
    - cron: "*/20 * * * *" # GitHub often starts these late; each run then watches for ~50 min
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report matches, send nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orbit-dm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/orbit-dm
      - run: python3 scripts/orbit-dm/bot.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # scheduled runs check every minute for ~50 min; manual runs check once
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '50' || '0' }}
