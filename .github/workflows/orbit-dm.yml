name: Orbit comment bot

# Comment ORBIT on an Instagram post -> the Orbit link arrives by DM and the comment is hidden.
# Script: scripts/orbit-dm/bot.py. Needs the repo secret IG_ACCESS_TOKEN.
# Switched off 14 Nov 2026: Orbit is off every touchpoint (Ashah, 6 Nov 2026).
# The schedule is removed so nothing runs; manual runs still work. To restore, add back:
#   schedule:
#     - cron: "*/20 * * * *"
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report matches, send nothing"
        type: boolean
        default: false
      diag:
        description: "Also print account checks (no secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orbit-dm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/orbit-dm
      - run: python3 scripts/orbit-dm/bot.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          DIAG: ${{ inputs.diag && '1' || '' }}
          # scheduled runs check every minute for ~50 min; manual runs check once
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '50' || '0' }}
