<header class="hero"><a class="back" href="__BASE__/work/">&larr; All work</a><div class="hero-c"><img class="cover" src="__BASE__/images/work/the-codes-v2/01.webp" alt="The Codes: a full moon over still water, the title in light" width="1600" height="900"><h1>The ‘A·M·W’ Codes</h1><p class="cap">How the A·M·W world looks, moves and speaks. One idea per page.</p></div></header>
<main><section class="ch" style="--c:#7FD8F0"><div class="wrap"><h2>The rule</h2><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/03.webp" alt="Every frame is a place you could step into." loading="lazy" decoding="async" width="1600" height="900"><figcaption>The rule above every rule. Every page after this visits another corner of the same world, in its own light.</figcaption></figure></div></section><section class="ch" style="--c:#F2B48C"><div class="wrap"><h2>Colour and light</h2><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/04.webp" alt="Night is the canvas." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Mostly night. Colour lives in a thin band and in the lights. Palette: midnight #070B18, sapphire #16367A, indigo #22175A, violet #3A1F66, mauve #8A4C8E, dusk rose #E08C7E, peach gold #F2B48C, aqua #7FD8F0. Lights: blue #03A2FF, purple #7C5CFF, pink #E04BAE, green #45E992.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/05.webp" alt="One source. Let the rest fall to black." loading="lazy" decoding="async" width="1600" height="900"><figcaption>One light, one place to look. If the answer to where the light comes from is everywhere, relight it.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/06.webp" alt="Light lives on water." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Every light in this frame lives twice: once in the city, once on the water.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/07.webp" alt="Light glows. Nothing ends in a line." loading="lazy" decoding="async" width="1600" height="900"><figcaption>The beam fades out, never cuts off. Soft core, wide bloom.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/08.webp" alt="One magic moment per piece." loading="lazy" decoding="async" width="1600" height="900"><figcaption>One per frame, one per page.</figcaption></figure></div></section><section class="ch" style="--c:#F3D58C"><div class="wrap"><h2>The frame</h2><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/09.webp" alt="Small figure, big world." loading="lazy" decoding="async" width="1600" height="900"><figcaption>The figure takes up a sliver of the frame. The world does the talking.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/10.webp" alt="Horizons sit on a third. Subjects sit off-centre." loading="lazy" decoding="async" width="1600" height="900"><figcaption>The guides show it: horizon on the lower third, the road bending through the right third.</figcaption></figure></div></section><section class="ch" style="--c:#F27BB8"><div class="wrap"><h2>People and place</h2><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/11.webp" alt="Caught in motion." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Every shot is directed, then played as if it was found.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/12.webp" alt="Live at the threshold." loading="lazy" decoding="async" width="1600" height="900"><figcaption>The moon steps aside: the door is now the one light.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/13.webp" alt="Blue hour to midnight." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Dusk colour only when the story is dusk; moonlight stays silver.</figcaption></figure></div></section><section class="ch" style="--c:#7DF2B4"><div class="wrap"><h2>Motion and voice</h2><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/14.webp" alt="Drift, don’t cut." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Edits breathe on the beat of the music, not on every syllable.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/15.webp" alt="Serif for feeling, sans for facts." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Two typefaces only. Headlines never bold, never all caps. One coloured word at most.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/16.webp" alt="Speak in images." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Analogies over jargon, conviction over hype. Short sentences, plain words, one idea at a time.</figcaption></figure><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/17.webp" alt="Lift and ground." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Every piece carries both. Lift: soul, showmanship, framing, redefinition. Ground: analogy, concretisation, demonstration, rapport.</figcaption></figure></div></section><section class="ch" style="--c:#8FB4F6"><div class="wrap"><h2>In every format</h2><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/18.webp" alt="Different every time. Unmistakably ours." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Reels, carousels, LinkedIn, the site, the letters. Each piece looks different from the last and still belongs.</figcaption></figure></div></section><section class="ch" style="--c:#B9A4FF"><div class="wrap"><h2>The final check</h2><figure class="sl"><img src="__BASE__/images/work/the-codes-v2/19.webp" alt="Before anything meets the world." loading="lazy" decoding="async" width="1600" height="900"><figcaption>Four questions before anything ships. If a piece can’t answer all four, it doesn’t ship yet.</figcaption></figure></div></section></main>
<section class="close"><div class="moon" aria-hidden="true"></div><p class="line">Every frame is a place you could <span>step into.</span></p><p class="mark">A·M·W</p></section>
