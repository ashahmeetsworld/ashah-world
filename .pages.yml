# Pages CMS config — log in at https://app.pagescms.org with GitHub,
# pick this repo, and you get a visual editor for everything below.
media:
  input: public/images
  output: /images

content:
  - name: work
    label: Portfolio
    type: collection
    path: src/content/work
    filename: '{fields.title}.md'
    view:
      fields: [title, skill, year, featured]
      primary: title
      sort: [order, title]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: One-line summary, type: text, required: true }
      - { name: client, label: Client, type: string, default: Ashah Meets World }
      - { name: year, label: Year, type: string, required: true }
      - name: skill
        label: Skill
        type: select
        required: true
        options:
          values: [Creative Direction, Ecosystem Design, Cultural Leadership, Campaign Marketing]
      - { name: role, label: My role, type: string }
      - { name: cover, label: Cover image, type: image, required: true }
      - name: coverRatio
        label: Cover shape
        type: select
        default: landscape
        options:
          values: [landscape, portrait]
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - { name: image, label: Image, type: image }
          - { name: caption, label: Caption, type: string }
      - { name: link, label: Live link (optional), type: string }
      - { name: featured, label: Show on home page, type: boolean, default: true }
      - { name: order, label: Order (lower shows first), type: number, default: 100 }
      - { name: draft, label: Hide (draft), type: boolean, default: false }
      - { name: body, label: Case study, type: rich-text }

  - name: notes
    label: Field Notes
    type: collection
    path: src/content/notes
    filename: '{fields.number}-{fields.title}.md'
    view:
      fields: [number, title]
      primary: title
      sort: [number]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: number, label: Number, type: string, required: true }
      - { name: cover, label: Cover slide, type: image, required: true }
      - { name: link, label: Link to the post, type: string }
      - { name: date, label: Posted on, type: date }

  - name: offers
    label: Sales pages
    type: collection
    path: src/content/offers
    filename: '{fields.title}.md'
    view:
      fields: [title, headline]
      primary: title
    fields:
      - { name: title, label: Offer name (also the page address), type: string, required: true }
      - { name: eyebrow, label: Small line above the name, type: string }
      - { name: headline, label: Headline, type: text, required: true }
      - { name: subhead, label: Subheadline, type: text, required: true }
      - name: problem
        label: The tension
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - name: points
            label: Points
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: text, label: Text, type: text }
      - name: promise
        label: The promise
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: outcomes, label: Outcomes, type: string, list: true }
      - name: tiers
        label: The stack (tiers)
        type: object
        list: true
        fields:
          - { name: stage, label: Stage (e.g. The spark), type: string }
          - { name: name, label: Name, type: string }
          - { name: price, label: Price, type: string }
          - { name: text, label: Description, type: text }
          - { name: includes, label: Includes, type: string, list: true }
          - { name: highlight, label: Highlight this tier, type: boolean }
      - name: steps
        label: How it works
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: fit
        label: Who it's for
        type: object
        fields:
          - { name: 'yes', label: For, type: string, list: true }
          - { name: 'no', label: Not for, type: string, list: true }
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - name: cta
        label: Closing call to action
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: label, label: Button label, type: string }
      - { name: draft, label: Hide (draft), type: boolean, default: false }
      - { name: body, label: Extra section (optional), type: rich-text }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Site name, type: string }
      - { name: monogram, label: Monogram, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: intro, label: Intro line, type: text }
      - { name: description, label: Search / share description, type: text }
      - { name: location, label: Location, type: string }
      - { name: email, label: Public email, type: string }
      - { name: contactFormUrl, label: Contact form link (Tally share link), type: string }
      - { name: contactFormEmbed, label: Contact form embed code (Tally), type: code }
      - { name: newsletterUrl, label: Email list link (Brevo hosted form), type: string }
      - { name: newsletterEmbed, label: Email list embed code (Brevo), type: code }
      - { name: orbitFormUrl, label: Orbit sign-up form link (Brevo form "OS sign-up"; used by the Orbit page and the pop-up), type: string }
      - { name: lucidFormUrl, label: Lucid pre-sign-up form link (Brevo form "Lucid list"; empty = preview mode), type: string }
      - { name: discordUrl, label: Discord invite link, type: string }
      - { name: instagramFeedUrl, label: Instagram feed link (Behold JSON feed), type: string }
      - { name: bookingUrl, label: Booking link (Calendly / Cal.com), type: string }
      - name: socials
        label: Socials
        type: object
        list: true
        fields:
          - { name: label, label: Platform, type: string }
          - { name: url, label: Link, type: string }

  - name: about
    label: About page
    type: file
    path: src/data/about.json
    format: json
    fields:
      - { name: eyebrow, label: Small line above the title, type: string }
      - { name: title, label: Title, type: string }
      - { name: lede, label: Opening line, type: text }
      - { name: intro, label: Intro paragraphs, type: text, list: true }
      - { name: portrait, label: Portrait photo, type: image }
      - { name: portraitCaption, label: Portrait caption, type: string }
      - { name: mission, label: Mission, type: text }
      - name: story
        label: Story
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - name: chapters
            label: Chapters
            type: object
            list: true
            fields:
              - { name: label, label: Feeling, type: string }
              - { name: years, label: Years (optional), type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
      - name: positioning
        label: Positioning
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - name: points
            label: Points
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: text, label: Text, type: text }

  - name: community
    label: Community page
    type: file
    path: src/data/community.json
    format: json
    fields:
      - { name: eyebrow, label: Small line above the title, type: string }
      - { name: title, label: Title, type: string }
      - { name: lede, label: Opening line, type: text }
      - { name: intro, label: Intro, type: text }
      - { name: leadEyebrow, label: Leadership small label, type: string }
      - { name: leadTitle, label: Leadership title, type: string }
      - { name: leadText, label: Leadership text, type: text }
      - name: roles
        label: The two roles
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: line, label: Text, type: text }
      - { name: talent, label: Talent in the constellation, type: string, list: true }
      - { name: ethosEyebrow, label: Ethos small label, type: string }
      - { name: ethosTitle, label: Ethos title, type: string }
      - { name: ethosText, label: Ethos text, type: text }
      - name: ethos
        label: The ethos
        type: object
        list: true
        fields:
          - { name: title, label: Principle, type: string }
          - { name: text, label: Text, type: text }
          - { name: practice, label: What it looks like, type: string }
      - { name: pocketsEyebrow, label: Pockets small label, type: string }
      - { name: pocketsTitle, label: Pockets title, type: string }
      - { name: pocketsText, label: Pockets text, type: text }
      - name: pockets
        label: Pockets
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: line, label: One line, type: string }
      - { name: joinTitle, label: Join title, type: string }
      - { name: joinText, label: Join text, type: text }
