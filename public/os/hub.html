<script>
/* ---------- Orbit Phase 2: chats inside the hub ----------
   Served by the hub's engine (http://127.0.0.1:4777), every chat button opens a chat right here,
   through Claude Code on this computer, signed in to their own Claude plan. Opened as a plain file,
   the hub hops over to the engine when it's running, or offers Phase 2 when it isn't. */
(() => {
const ENGINE = "http://127.0.0.1:4777/";
const ON_ENGINE = location.protocol === "http:" && location.port === "4777";
const webOpen = typeof _openClaudeOut === "function" ? _openClaudeOut : openClaude;  // the old way: a Claude chat or Project in a new tab
const KEY = "orbit-chats";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } };
const store = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
const nameOf = id => { try { return skillName(id); } catch (e) { return "your helper"; } };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

// ----- opened as a file: move over to the engine if it's running -----
if (!ON_ENGINE) {
  const webFeed = (skill, text) => webOpen(skill, /^Upgrade my Orbit/.test(String(text || "")) ? text : ORBIT.mail.feed(skill) + (text || ""));  // v0.4.6: the chat starts already in the loop
  openClaude = webFeed; startChat = (skill, text) => webFeed(skill, text);  // no engine: chats open in Claude
  if (location.protocol !== "file:" || ORBIT.sample()) return webLessons();
  const ping = new Image();
  ping.onload = () => {
    let moved = false; try { moved = localStorage.getItem("orbit-moved") === "1"; } catch (e) {}
    if (moved) return location.replace(ENGINE);
    try { localStorage.setItem("orbit-moved", "1"); } catch (e) {}
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(ORBIT.world)))).replace(/\+/g, "-").replace(/\//g, "_");
    location.replace(ENGINE + "#world=" + b64);
  };
  ping.onerror = () => { phase2Nudge(); webLessons(); };
  ping.src = ENGINE + "ping.gif?" + Date.now();
  return;
}

// without the engine, a lesson opens as a Claude chat with the same brief
function webLessons() {
  const names = ["foundations", "working depth", "mastery"];
  beginLesson = (topic, layer) => webOpen("mentor", `Let's begin a lesson on ${topic}, layer ${layer} (${names[(layer || 1) - 1]}). Teach it through one analogy and a thought experiment, then check my understanding one question at a time. When I've proven it, tell me to tick Layer ${layer} in my hub.`);
}
function phase2Nudge() {
  try { if (localStorage.getItem("orbit-p2-later") === new Date().toISOString().slice(0, 10)) return; } catch (e) {}
  document.body.insertAdjacentHTML("beforeend", `<div id="p2" class="p2n"><b>Bring your hub to life.</b> <span>Optional: chat with your team right here, not in a new tab. Double-click <i>Bring your hub to life</i> in your Orbit Hub folder. About 5 minutes.</span>
    <a href="#" id="p2more">How</a><a href="#" id="p2x" title="Not today">×</a></div>`);
  document.getElementById("p2x").onclick = ev => { ev.preventDefault(); try { localStorage.setItem("orbit-p2-later", new Date().toISOString().slice(0, 10)); } catch (e) {} document.getElementById("p2").remove(); };
  document.getElementById("p2more").onclick = ev => { ev.preventDefault(); modal(`<h3>Bring your hub to life</h3>
    <p>Optional. Everything already works: each chat button opens Claude in a new tab. This puts the chats, lessons and live updates right here in your hub, on your own Claude plan. No API key, nothing extra to pay. Stuck? Close this and carry on: nothing breaks, and you can try again any time.</p>
    <ol><li>Open your <b>Orbit Hub</b> folder and double-click <b>Bring your hub to life</b> (.bat on Windows, .command on Mac).</li>
    <li>Your browser opens twice: click <b>Authorize</b> for Claude, then <b>Allow access</b> for Notion.</li>
    <li>That's it. Your hub reopens with chats inside. From then on, Start Orbit Hub as usual.</li></ol>
    <p class="hint">No Bring your hub to life file in your folder (older folders call it Turn on hub chats)? Type <b>update</b> in TEAM - Operations: you'll get a fresh Orbit Hub folder with it inside. Needs a paid Claude plan (Pro or Max), which Orbit already uses. Your computer needs to be on for chats, like any app.</p>`); };
}

function modal(html) {
  document.querySelector(".p2m")?.remove();
  document.body.insertAdjacentHTML("beforeend", `<div class="p2m"><div class="p2c">${html}<div class="pills" style="margin-top:14px"><a href="#" class="pill on" id="p2ok">Got it</a></div></div></div>`);
  const m = document.querySelector(".p2m");
  m.onclick = ev => { if (ev.target === m || ev.target.id === "p2ok") { ev.preventDefault(); m.remove(); } };
}

// ----- on the engine: chats in a side panel -----
let STATUS = null;
fetch("/api/status").then(r => r.json()).then(s => { STATUS = s; if (!s.chats) webLessons(); }).catch(() => { STATUS = { chats: false }; webLessons(); });
startChat = (skill, text) => openClaude(skill, text);  // every seat chat uses the side panel
const state = load();
let cur = null, busy = false;

function md(t) {
  const e = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = s => e(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const out = []; let list = null;
  String(t || "").replace(/\r/g, "").split("\n").forEach(line => {
    const li = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) { if (!list) { list = []; out.push(list); } list.push(inline(li[1])); return; }
    list = null;
    if (!line.trim()) return out.push("");
    const h = line.match(/^#{1,4}\s+(.*)/);
    out.push(h ? `<p><b>${inline(h[1])}</b></p>` : `<p>${inline(line)}</p>`);
  });
  return out.map(x => Array.isArray(x) ? `<ul>${x.map(i => `<li>${i}</li>`).join("")}</ul>` : x).join("");
}

function draw() {
  const p = document.getElementById("oc"); if (!p || !cur) return;
  const c = state[cur] || { msgs: [] };
  p.querySelector(".och b").textContent = cap(nameOf(cur));
  const box = p.querySelector(".ocm");
  box.innerHTML = (c.msgs.length ? "" : `<p class="ocempty">Ask ${esc(nameOf(cur))} anything. It knows your Orbit and reads your Notion.</p>`) +
    c.msgs.map((m, i) => `<div class="ocb ${m.r}">${m.r === "me" ? `<p>${esc(m.t).replace(/\n/g, "<br>")}</p>` : md(m.t)}${(m.reco ? `<div class="ocreco"><span class="caps">${ic("spark", 11)}A better way</span><p>${esc(m.reco.t)}</p>${m.reco.added ? `<i>In your Recos</i>` : `<button class="pill" data-reco="${i}">Add to Recos</button>`}</div>` : "") + orbitMailHTML(m, i) + (m.files || []).map(f => `<a class="pill" href="/out/${encodeURIComponent(f)}" target="_blank" rel="noopener">${ic("easel", 13)}Open ${esc(f.replace(/\.[a-z]+$/i, "").replace(/[-_]/g, " "))}</a>`).join("")}</div>`).join("") +
    (busy ? `<div class="ocb ai think"><p>${esc(cap(nameOf(cur)))} is thinking<span>.</span><span>.</span><span>.</span></p><p class="hint">Looking things up in Notion can take a minute.</p></div>` : "");
  box.scrollTop = box.scrollHeight;
  p.querySelector("button[type=submit]").disabled = busy;
  box.querySelectorAll("[data-reco]").forEach(b => b.onclick = () => { const m = c.msgs[+b.dataset.reco]; if (!m || !m.reco) return; ORBIT.reco(m.reco.t, m.reco.k, nameOf(cur)); m.reco.added = true; store(state); draw(); orbitRefresh(); });
  orbitMailWire(box, c.msgs, () => { store(state); draw(); });
}

function panel() {
  if (document.getElementById("oc")) return document.getElementById("oc");
  document.body.insertAdjacentHTML("beforeend", `<aside id="oc" class="oc"><div class="och"><span class="caps">Chat</span><b></b><a href="#" id="ocnew" title="Start fresh">New chat</a><a href="#" id="ocx" title="Close">×</a></div>
    <div class="ocm"></div><form class="ocf"><textarea rows="2" placeholder="Type here. Enter sends, Shift+Enter for a new line."></textarea><button class="pill on" type="submit">Send</button></form></aside>`);
  const p = document.getElementById("oc"), ta = p.querySelector("textarea");
  p.querySelector("#ocx").onclick = ev => { ev.preventDefault(); p.classList.remove("open"); };
  p.querySelector("#ocnew").onclick = ev => { ev.preventDefault(); if (busy) return; state[cur] = { msgs: [] }; store(state); draw(); ta.focus(); };
  ta.onkeydown = ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); p.querySelector("form").requestSubmit(); } };
  p.querySelector("form").onsubmit = ev => { ev.preventDefault(); const t = ta.value.trim(); if (t && !busy) { ta.value = ""; send(t); } };
  return p;
}

async function send(text) {
  const id = cur, c = state[id] = state[id] || { msgs: [] };
  c.msgs.push({ r: "me", t: text }); busy = true; store(state); draw();
  let reply;
  try {
    const feed = ORBIT.mail.feed(id);  // v0.4.6: unread updates, open asks and answers, handed over quietly before the founder's words
    const r = await (typeof _f === "function" ? _f : fetch)("/api/chat", { method: "POST", headers: { "Content-Type": "application/json", "X-Orbit-Hub": "1" }, body: JSON.stringify({ helper: id, msg: (window.orbitVoice ? orbitVoice.note(id) : "") + feed + text, sid: c.sid || null }) });  // v0.4.8: voice note when spoken
    const body = await r.text();
    if (!r.ok) throw new Error(body || "The hub's engine didn't answer.");
    reply = JSON.parse(body);
    if (reply.sid) c.sid = reply.sid;
    const L = orbitLines(reply.text), mail = orbitApply(id, L);
    c.msgs.push({ r: "ai", t: L.text, files: reply.files || [], reco: L.reco, mail });
    if (window.orbitVoice) orbitVoice.reply(id, L.text);  // v0.4.8: read out in the seat's own voice
    if (mail.notes.length || mail.hubs.length) orbitRefresh();
  } catch (e) {
    c.msgs.push({ r: "ai err", t: String(e.message || e).replace(/^TypeError: Failed to fetch$/, "The hub's engine isn't running. Double-click Start Orbit Hub again.") });
  }
  c.msgs = c.msgs.slice(-60); busy = false; store(state);
  if (cur === id) draw();
}

openClaude = function (skill, text) {
  text = String(text || "").trim();
  // Upgrades and anything that needs Claude in Chrome stay in the Claude app.
  if (/^Upgrade my Orbit/.test(text) || (STATUS && !STATUS.chats)) return webOpen(skill, text);
  if (busy && cur !== skill) { /* let the other chat finish in the background */ }
  cur = skill; const p = panel(); p.classList.add("open"); draw();
  const ta = p.querySelector("textarea");
  if (text && !/[:…]$/.test(text) && !busy) send(text); else { ta.value = text ? text + " " : ""; ta.focus(); }
};
document.getElementById("ask").onsubmit = ev => { ev.preventDefault(); const q = document.getElementById("q"); if (!q.value.trim()) return; openClaude(q.dataset.skill || "desk", q.value.trim()); q.value = ""; };
})();
</script>

<script>
/* ---------- Orbit v0.4.8 · voices ----------
   The Personal Assistant, the Council (Mentor, Advisory Board, Coach) and the six helpers answer out loud, each in its own voice.
   Close the chat (or start a new one) and the voice stops.
   Hold the mic (or hold Space) and talk, let go to send. Holding again cuts the reply off. Never hands-free:
   it would pick up the founder talking to other people in the room.
   The voices are made on this computer by the engine (/api/voice/*). Until they're set up, or on an older engine,
   the browser's own voice reads the reply. */
(() => {
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const VOICED = { desk: 1, mentor: 1, board: 1, coach: 1, ops: 1, cd: 1, cp: 1, bd: 1, fo: 1, cs: 1 };  // everyone with a voice in the engine
const EF = (u, o) => (typeof _f === "function" ? _f : window.fetch)(u, o);
const NOTE = "[Voice chat: they're talking out loud with you and will hear your reply read aloud. Answer in 1 to 3 short spoken sentences, in plain everyday words. No lists, headings, markdown, links or emoji. If there's more, give the headline and offer to go deeper.]\n\n";
let voiceNext = 0, spoken = null, vstate = { state: "off" };  // voiceNext: when the last spoken message was sent

const status = start => EF("/api/voice/status" + (start ? "?start=1" : "")).then(r => r.ok ? r.json() : { state: "none" }).catch(() => ({ state: "none" }))
  .then(s => (vstate = s));

function speakable(t) {
  return String(t || "").replace(/```[\s\S]*?```/g, " ").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/[*_#>`|~]/g, "")
    .replace(/^\s*(?:[-•]|\d+[.)])\s+/gm, "").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "").replace(/\s+/g, " ").trim();
}
function browserVoice() {
  const v = window.speechSynthesis ? speechSynthesis.getVoices() : [], en = v.filter(x => /^en/i.test(x.lang)), nat = x => /natural|online|neural/i.test(x.name);
  return en.find(x => nat(x) && x.lang === "en-AU") || en.find(nat) || en.find(x => x.lang === "en-AU") || en[0] || null;
}

/* Speaker: cuts the reply into sentences, fetches each one's voice ahead of time, plays them in order. */
const Speaker = (() => {
  let id = 0, queue = [], playing = null;
  async function synth(seat, text) {
    if (vstate.state !== "ready") return null;
    try {
      const r = await EF("/api/voice/say", { method: "POST", headers: { "Content-Type": "application/json", "X-Orbit-Hub": "1" }, body: JSON.stringify({ helper: seat, text }) });
      return r.ok ? URL.createObjectURL(await r.blob()) : null;
    } catch (e) { return null; }
  }
  async function pump() {
    if (playing || !queue.length) return;
    const job = playing = queue.shift(), my = id, url = await job.audio;
    if (my !== id) { if (url) URL.revokeObjectURL(url); return; }
    const next = () => { if (url) URL.revokeObjectURL(url); if (playing === job) { playing = null; pump(); } };
    if (url) { job.el = new Audio(url); job.el.onended = job.el.onerror = next; job.el.play().catch(next); }
    else if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(job.text); u.voice = browserVoice(); u.rate = 1.03; u.onend = u.onerror = next; speechSynthesis.speak(u); }
    else next();
  }
  async function say(seat, text) {
    stop(); const my = id;
    await status();
    if (my !== id) return;
    const t = speakable(text).slice(0, 1500);
    (t.match(/[^.!?…]+[.!?…]+["')\]]?|[^.!?…]+$/g) || []).map(s => s.trim()).filter(s => /[a-z0-9]/i.test(s))
      .forEach(s => queue.push({ text: s, audio: synth(seat, s) }));
    pump();
  }
  function stop() {
    id++; queue = [];
    if (playing && playing.el) { playing.el.onended = playing.el.onerror = null; playing.el.pause(); }
    playing = null; if (window.speechSynthesis) speechSynthesis.cancel();
  }
  return { say, stop };
})();

/* Hooks the chat calls (see send() in the chat block). */
window.orbitVoice = {
  note(seat) { spoken = Date.now() - voiceNext < 3000 && VOICED[seat] ? seat : null; voiceNext = 0; return spoken ? NOTE : ""; },
  reply(seat, text) { if (spoken !== seat) return; spoken = null; if (text && chatOpen()) Speaker.say(seat, text); },  // chat closed = no voice
  say: (seat, text) => Speaker.say(seat, text),
  stop: () => Speaker.stop()
};

/* Hold to talk */
const MIC = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
let rec = null, holding = null, setupNoted = false;
const chatOpen = () => { const p = document.getElementById("oc"); return p && p.classList.contains("open") ? p : null; };
function target() {
  const p = chatOpen();
  if (p) return { form: p.querySelector("form"), box: p.querySelector("textarea") };
  const f = document.getElementById("ask");
  return f && !f.hidden ? { form: f, box: document.getElementById("q") } : null;
}
function hint(f, text) {
  let n = f.querySelector(".vnote");
  if (!n) { f.insertAdjacentHTML("beforeend", `<span class="vnote"></span>`); n = f.querySelector(".vnote"); }
  n.textContent = text; n.classList.add("on"); clearTimeout(hint.t); hint.t = setTimeout(() => n.classList.remove("on"), 5000);
}
function startTalk() {
  if (holding || !SR) return;
  const t = target(); if (!t) return;
  Speaker.stop(); holding = t;
  status(true).then(s => {
    if (setupNoted || s.state === "ready" || s.state === "none") return;
    setupNoted = true; hint(t.form, s.state === "failed" ? "Your helpers' own voices couldn't set up. The browser voice will read replies for now." : "Your helpers' voices are setting up (about 350MB, once). The browser voice reads replies until then.");
  });
  t.form.classList.add("listening");
  const before = t.box.value.trim();
  rec = new SR(); rec.lang = "en-AU"; rec.interimResults = true; rec.continuous = true;
  rec.onresult = e => { t.box.value = ((before ? before + " " : "") + [...e.results].map(r => r[0].transcript).join(" ")).trim(); };
  rec.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") hint(t.form, "Allow the microphone for this page, then hold the mic again."); };
  rec.onend = () => { if (holding === t && rec) try { rec.start(); } catch (e) {} };
  try { rec.start(); } catch (e) {}
}
function stopTalk() {
  const t = holding; if (!t) return;
  holding = null; t.form.classList.remove("listening");
  const r = rec; rec = null;
  setTimeout(() => { try { r && r.stop(); } catch (e) {} if (t.box.value.trim()) { voiceNext = Date.now(); t.form.requestSubmit(); } }, 350);
}
function addMic(f) {
  if (!SR || !f || f.querySelector(".vmic")) return;
  const send = f.querySelector("button[type=submit], button:not([type])");
  send.insertAdjacentHTML("beforebegin", `<button type="button" class="vmic" title="Hold to talk (or hold Space). Let go to send.">${MIC}</button>`);
  const b = f.querySelector(".vmic");
  b.addEventListener("pointerdown", e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} startTalk(); });
  ["pointerup", "pointercancel"].forEach(k => b.addEventListener(k, stopTalk));
  b.addEventListener("click", e => e.preventDefault());
}
const typing = () => { const a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable); };
addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && !typing() && SR && target()) { e.preventDefault(); startTalk(); } });
addEventListener("keyup", e => { if (e.code === "Space" && holding) { e.preventDefault(); stopTalk(); } });
addEventListener("keydown", e => { if (e.key === "Escape") Speaker.stop(); });

addMic(document.getElementById("ask"));
/* Close the chat (or start a new one) and the voice stops, and a reply still on its way stays silent. */
function hush() { spoken = null; voiceNext = 0; Speaker.stop(); }
let watched = null;
new MutationObserver(() => {
  const p = document.getElementById("oc"); if (!p || p === watched) return;
  watched = p; addMic(p.querySelector("form"));
  new MutationObserver(() => { if (!p.classList.contains("open")) hush(); }).observe(p, { attributes: true, attributeFilter: ["class"] });
  p.addEventListener("click", e => { if (e.target.closest("#ocnew")) hush(); });
}).observe(document.body, { childList: true });
if (location.port === "4777") status(false);  // wakes the voices if they were set up before
})();
</script>

<script>
/* ---------- Orbit v0.4.7 · the Coach ----------
   A third seat at the Council: the sunrise. It keeps life outside work strong across the leverage points.
   Build my Coach runs Coach-setup.md (Orbit site) as a chat that builds a Coach page in their own Notion and ends with a
   COACH: line; the hub keeps that as world.coach (their daily few, extras and week), and ticks as world.coachLog.
   On launch day the main page opens with a dawn takeover: "Coach now available". */
(() => {
const SITE = "https://ashahmeetsworld.github.io/ashah-world/os/";
const FROM = Date.parse("2026-11-02T12:00:00Z");   // live from 11pm, 2 Nov 2026, Melbourne (Ashah: live now)
const C = "#F4B45E";
const preview = /coach-preview/.test(location.search + location.hash);
const live = () => preview || Date.now() >= FROM;
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
COL.coach = COL.coach || C;
SKILL_NAMES.coach = "your Coach";
const SUN = '<circle cx="12" cy="14" r="4"/><path d="M3 18h18M12 5v2M5.6 8.6l1.4 1.4M18.4 8.6L17 10M2 14h2M20 14h2"/>';
P.sun = SUN;
const AREAS = ["Physical", "Spiritual", "Mental", "Emotional", "Relational", "Financial"];
const ACOL = { Physical: C, Spiritual: "#45E992", Mental: "#6F9BFF", Emotional: "#FF9AB8", Relational: "#B49CFF", Financial: "#7FD8F0" };
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const SAMPLE_COACH = { few: [{ a: "Physical", h: "Move for 30 minutes" }, { a: "Spiritual", h: "10 minutes of breathwork" }, { a: "Mental", h: "One chapter" }, { a: "Relational", h: "One real message" }], extras: ["Cold exposure"], week: ["Gym", "Walk", "Gym", "Walk", "Gym", "Rest", "Long walk"] };
const SETUP = `Set up my Coach. Read the Coach setup file in full: ${SITE}Coach-setup.md (if you can't fetch it, open it in a new tab through Claude in Chrome). Then follow it exactly, as if I'd dropped it in and typed start.`;
const plan = () => { const c = coach(); if (!c) return ""; return ` My plan as it is in my hub (the latest; if my Coach page in Notion differs, update it to match): daily few: ${c.few.map(f => `${f.a}: ${f.h}`).join("; ")}.${c.extras && c.extras.length ? ` Extras: ${c.extras.join(", ")}.` : ""}${c.week ? ` Week: ${c.week.map((w, i) => DAYS[i] + " " + w).join(", ")}.` : ""}`; };
const ASK = t => `Coach: read my Coach page in Notion first.${plan()} ${t}`;

/* their Coach: from the world file (or the sample) */
const W = () => ORBIT.world;
const coach = () => ORBIT.sample() ? SAMPLE_COACH : (W().coach || null);
const log = () => { const w = W(); if (!w.coachLog) w.coachLog = {}; return w.coachLog; };
const pad = n => String(n).padStart(2, "0"), iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n), dow = d => (d.getDay() + 6) % 7;
function setCoach(c) {
  if (!c || ORBIT.sample()) return;
  const clean = { few: (c.few || []).filter(x => x && (x.h || x.habit)).slice(0, 8).map(x => ({ a: String(x.a || x.area || "Physical").slice(0, 30), h: String(x.h || x.habit).slice(0, 80) })),
    extras: (c.extras || []).map(x => String(x).slice(0, 60)).filter(Boolean).slice(0, 6), week: Array.isArray(c.week) && c.week.length === 7 ? c.week.map(x => String(x || "").slice(0, 30)) : null,
    why: c.why ? String(c.why).slice(0, 200) : "" };
  if (/^https:\/\/claude\.ai\/project\/[0-9a-f-]{36}/.test(String(c.project || ""))) { W().projects = Object.assign({}, W().projects || {}, { coach: String(c.project) }); if (typeof DATA !== "undefined" && DATA) DATA.projects = W().projects; }
  W().coach = clean; ORBIT.save(); put("orbit-coach-built", "1");
}
// the skip rule, per habit: skip one day, never two in a row; three in a row earns the pass back
function chain(key) {
  const L = log(), today = new Date(), t0 = iso(today), days = Object.keys(L).filter(d => (L[d] || {})[key]).sort();
  const first = days[0] ? new Date(days[0] + "T00:00:00") : today;
  let pass = true, run = 0, broke = false;
  for (let d = first; iso(d) < t0; d = addDays(d, 1)) {
    if ((L[iso(d)] || {})[key]) { run++; if (!pass && run >= 3) { pass = true; broke = false; } }
    else { if (pass) pass = false; else broke = true; run = 0; }
  }
  const done = !!(L[t0] || {})[key];
  if (done && !pass && run + 1 >= 3) pass = true;
  const need = pass ? 0 : 3 - (run + (done ? 1 : 0));
  const note = !days.length && !done ? "start today" : pass ? "skip pass ready" : broke ? `chain broke · ${need} in a row resets it` : need < 3 || done ? `pass back after ${need} more` : "skip used · not today";
  return { done, streak: run + (done ? 1 : 0), note };
}
function tick(key) {
  if (ORBIT.sample()) return demoSay ? demoSay("In your own hub, this ticks today off and keeps your streak.") : 0;
  const L = log(), t0 = iso(new Date()); L[t0] = L[t0] || {};
  if (L[t0][key]) delete L[t0][key]; else L[t0][key] = 1;
  ORBIT.save(); route();
}
// a COACH: line at the end of the setup chat fills the room (the chat panel never shows it)
if (typeof orbitLines === "function") {
  const _ol = orbitLines;
  orbitLines = function (text) {
    const keep = String(text || "").split("\n").filter(line => {
      const m = line.match(/^\s*\**COACH\**\s*:\s*(\{.*\})\s*$/);
      if (!m) return true;
      try { setCoach(JSON.parse(m[1])); setTimeout(route, 50); } catch (e) {}
      return false;
    }).join("\n");
    return _ol(keep);
  };
}
const build = () => { put("orbit-coach-built", "1"); openClaude("coach", SETUP); };

/* the sunrise door, after the Board's (same as the Mentor's and the Board's) */
function door() {
  return `<a class="door coachdoor" href="#coach" style="${glass(C)}"><span class="arch"><span class="spill"></span><span class="ic">${ic("sun", 30, 1.1)}</span>${figure}</span>
    <span class="caps" style="margin-top:22px;color:var(--c)">Coach</span><h2>The sunrise</h2><p>Train, breathe, show up. Every day.</p><span class="pill on">${ic("door", 13)}Go inside</span></a>`;
}
const scene = `<svg class="scene" viewBox="0 0 560 360"><defs><radialGradient id="cr-sun"><stop offset="0" stop-color="#FFF3DC" stop-opacity=".95"/><stop offset=".3" stop-color="${C}" stop-opacity=".35"/><stop offset="1" stop-color="${C}" stop-opacity="0"/></radialGradient></defs>
  <circle cx="330" cy="250" r="108" fill="url(#cr-sun)"/><path d="M290 250 A40 40 0 0 1 370 250 Z" fill="#FFF3DC"/>
  ${[-70, -45, -20, 20, 45, 70].map(a => { const r = a * Math.PI / 180; return `<line x1="${330 + 58 * Math.sin(r)}" y1="${250 - 58 * Math.cos(r)}" x2="${330 + 86 * Math.sin(r)}" y2="${250 - 86 * Math.cos(r)}" stroke="${C}" stroke-opacity=".5" stroke-width="1.2"/>`; }).join("")}
  <path d="M20 262 Q160 236 300 250 T540 246" fill="none" stroke="${rgba(C, .35)}"/><line x1="20" y1="250" x2="540" y2="250" stroke="${rgba(C, .18)}"/>
  <g fill="#03050C"><circle cx="190" cy="226" r="4"/><path d="M184 249 L186 233 Q190 230 194 233 L196 249 Z"/><path d="M186 236 L176 226 M194 236 L204 226" stroke="#03050C" stroke-width="2.4" stroke-linecap="round"/></g></svg>`;
const ico = d => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

/* the Coach's room: like the founder's own, filled with theirs */
function coachView() {
  const cc = coach(), t = new Date(), today = cc && cc.week ? cc.week[dow(t)] : "";
  const pill = (attr, i, label, on) => `<a class="pill${on ? " on" : ""}" href="#" ${attr}>${ic(i, 13)}${label}</a>`;
  const open = (txt) => `data-open="coach" data-text="${esc(ASK(txt))}"`;
  const pills = !cc
    ? pill("data-coach-build", "spark", "Build my Coach", 1)
    : (today && !/^rest/i.test(today) ? pill(open(`Walk me through today's session (${today}), one step at a time.`), "spark", `Today: ${esc(today)}`, 1) : pill(open("Check in with me: what's the one thing that matters most today?"), "spark", "Check in", 1))
      + pill(open("Find me a session for today: three options with real links, how long each is, and why it fits today."), "leaf", "Find a session")
      + (today && !/^rest/i.test(today) ? pill(open("Check in with me: how am I across my areas, one quick question at a time, then the one thing that matters most today."), "chat", "Check in") : "")
      + pill(open("Run my weekly look-back: wins, the habit that slipped, and one tiny change for next week."), "cal", "Weekly look-back");
  const rows = cc ? cc.few.map((f, i) => { const k = "f:" + f.h, ch = chain(k), c = ACOL[f.a] || C;
      return `<div class="three-row" style="--hc:${c}"><i class="${ch.done ? "on" : ""}" data-ctick="${esc(k)}" title="Tick today"></i><span>${esc(f.a)} <em>· ${esc(f.h)}</em></span><em>${ch.done ? "done ✓" : esc(ch.note)}</em></div>`; }).join("")
      + (cc.extras && cc.extras.length ? `<div class="cz-x">${cc.extras.map(x => { const k = "x:" + x, on = !!(log()[iso(t)] || {})[k] && !ORBIT.sample(); return `<button type="button" data-ctick="${esc(k)}" class="${on ? "on" : ""}">${on ? "✓ " : ""}${esc(x)}</button>`; }).join("")}</div>` : "")
    : `<p>Not set up yet. Build my Coach: a few quick questions, 5 to 10 minutes. Skip any and come back to it later.</p>`;
  const lev = AREAS.map(a => { const f = cc && cc.few.find(x => x.a.toLowerCase().startsWith(a.slice(0, 5).toLowerCase())); return `<div>${a}<em class="${f ? "on" : ""}">${f ? esc(f.h.length > 18 ? f.h.slice(0, 17) + "…" : f.h) : "not picked"}</em></div>`; }).join("");
  const week = cc && cc.week ? `<div class="cz-week">${cc.week.map((w, i) => `<span class="${i === dow(t) ? "on" : ""}">${DAYS[i][0]}<br>${esc((w || "Rest").slice(0, 7))}</span>`).join("")}</div>` : "";
  return `${scene}<div class="rh cz enter" style="margin-top:60px"><span class="caps eb">${ic("sun", 12)}The Council · the sunrise</span>
    <div class="title"><span class="badge">${ic("sun", 20)}</span><h1 class="serif">Coach</h1></div><p>Keeps your life outside work strong, so the work stays strong. Encouraging, and holds you to it.</p>
    <div class="pills">${pills}<a class="pill quiet" href="#council">${ic("back", 13)}The Council</a></div></div>
    <div class="cols cz enter" style="animation-delay:.15s;margin-top:200px">
      <div class="card"><div class="k">${ico('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>')}<span class="caps">Today's few</span>${cc ? `<a href="#" class="n" data-cedit>Edit</a>` : ""}</div>${rows}${week}</div>
      <div class="card"><div class="k">${ico('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>')}<span class="caps">Leverage points</span></div><div class="lev">${lev}</div></div>
      <div class="card"><div class="k">${ico('<path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.6 7.1 18.2l.9-5.5-4-3.9 5.5-.8z"/>')}<span class="caps">Holds you to it</span></div>
        <p>Skip one day, never two. After a skip, three in a row earns the pass back. Every week, a look-back.</p></div></div>`;
}
/* edit the few, the extras and the week right here (also how a Claude-tab setup lands in the hub) */
function editor() {
  if (ORBIT.sample()) return demoSay("In your own hub, Edit changes your daily few, extras and which day is which.");
  const cc = coach() || { few: [], extras: [], week: null }, wk = cc.week || ["", "", "", "", "", "", ""];
  const few = AREAS.map(a => { const f = cc.few.find(x => x.a.toLowerCase().startsWith(a.slice(0, 5).toLowerCase())); return `<label><span>${a}</span><input name="f-${a}" value="${esc(f ? f.h : "")}" placeholder="leave blank to skip"></label>`; }).join("");
  document.querySelector(".p2m")?.remove();
  document.body.insertAdjacentHTML("beforeend", `<div class="p2m"><form class="p2c cz-ed"><h3>Your daily few</h3>
    <p class="hint">One small thing per area, small enough for a bad day. Change it any time here: your Coach updates your Notion page to match next time you talk.</p>${few}
    <label><span>Extras</span><input name="extras" value="${esc((cc.extras || []).join(", "))}" placeholder="e.g. Cold exposure, Face and neck"></label>
    <div class="cz-wk">${DAYS.map((d, i) => `<label><span>${d}</span><input name="w${i}" value="${esc(wk[i] || "")}" placeholder="Rest"></label>`).join("")}</div>
    <div class="pills" style="margin-top:14px"><button class="pill on">Save</button><a href="#" class="pill quiet" data-x>Cancel</a></div></form></div>`);
  const m = document.querySelector(".p2m"), f = m.querySelector("form");
  m.onclick = ev => { if (ev.target === m || ev.target.dataset.x !== undefined) { ev.preventDefault(); m.remove(); } };
  f.onsubmit = ev => { ev.preventDefault(); const v = Object.fromEntries(new FormData(f));
    const week = DAYS.map((d, i) => (v["w" + i] || "").trim());
    setCoach({ why: cc.why, few: AREAS.map(a => ({ a, h: (v["f-" + a] || "").trim() })).filter(x => x.h), extras: (v.extras || "").split(",").map(x => x.trim()).filter(Boolean), week: week.some(Boolean) ? week.map(x => x || "Rest") : null });
    m.remove(); route(); };
}
function wireCoach(el) {
  el.querySelectorAll("[data-coach-build]").forEach(b => b.onclick = ev => { ev.preventDefault(); build(); });
  el.querySelectorAll("[data-ctick]").forEach(b => b.onclick = () => tick(b.dataset.ctick));
  el.querySelectorAll("[data-cedit]").forEach(b => b.onclick = ev => { ev.preventDefault(); editor(); });
}

const _routeCoach = route;
route = function () {
  const top = (location.hash.replace("#", "") || "home").split("/")[0];
  if (!live() || !DATA || DATA.setup) return _routeCoach();
  if (top === "coach") {
    navTo("council"); const view = document.getElementById("view"); view.dataset.v = "coach"; clearTimeout(focusTimer);
    setTint(C); view.innerHTML = coachView(); setAsk("coach", "your Coach"); wire(view); wireCoach(view); scrollTo(0, 0); return;
  }
  _routeCoach();
  if (top === "council") {
    const doors = document.querySelector(".doors");
    if (doors && !doors.querySelector(".coachdoor")) { doors.classList.add("three"); doors.insertAdjacentHTML("beforeend", door()); }
  }
};
window.removeEventListener("hashchange", _routeCoach);
window.addEventListener("hashchange", route);

/* launch day: the dawn takeover on the main page, once */
function takeover() {
  if (!live() || ORBIT.sample() || get("orbit-coach-seen") || coach() || document.getElementById("coachDawn")) return;
  const top = (location.hash.replace("#", "") || "home").split("/")[0];
  if (top !== "home") return;
  if (document.getElementById("tourWelcome")) return;   // a brand-new hub: the welcome goes first, the Coach next time
  document.body.insertAdjacentHTML("beforeend", `<div id="coachDawn" role="dialog" aria-label="Coach now available"><div class="cdin">
    <span class="caps">Orbit · new at your Council</span><h1>Coach now available</h1>
    <p>Your own training for a whole life, not just the work. You pick what matters. Your Coach builds it in your Notion and holds you to it.</p>
    <div class="cdchips">${["Physical", "Spiritual", "Emotional", "Mental", "Relationships"].map(a => `<span>${a}</span>`).join("")}</div>
    <a href="#" class="cdgo" id="cdGo">Build my Coach</a><span class="cdsmall">A few quick questions, 5 to 10 minutes. Skip any and come back to it later.</span><a href="#" class="cdno" id="cdNo">Not now</a></div>${sunArt(420)}</div>`);
  const close = () => { put("orbit-coach-seen", "1"); const d = document.getElementById("coachDawn"); d.classList.add("out"); setTimeout(() => d.remove(), 600); };
  document.getElementById("cdGo").onclick = ev => { ev.preventDefault(); close(); location.hash = "coach"; build(); };
  document.getElementById("cdNo").onclick = ev => { ev.preventDefault(); close(); };
}
function sunArt(w) {
  return `<svg class="cdsun" width="${w}" height="${w * .6}" viewBox="0 0 200 120" aria-hidden="true"><defs><radialGradient id="cgl" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#FFE7B8" stop-opacity=".9"/><stop offset="1" stop-color="${C}" stop-opacity="0"/></radialGradient></defs>
  <circle cx="100" cy="100" r="90" fill="url(#cgl)" opacity=".5"/><path d="M60 100a40 40 0 0 1 80 0z" fill="#FFF3DC"/>${[-60, -35, -12, 12, 35, 60].map(a => { const r = a * Math.PI / 180; return `<line x1="${100 + 52 * Math.sin(r)}" y1="${100 - 52 * Math.cos(r)}" x2="${100 + 70 * Math.sin(r)}" y2="${100 - 70 * Math.cos(r)}" stroke="${C}" stroke-width="2" stroke-linecap="round"/>`; }).join("")}<line x1="10" y1="100" x2="190" y2="100" stroke="${C}" stroke-opacity=".6"/></svg>`;
}
setTimeout(takeover, 1900);   // after the page and any welcome have drawn
window.ORBIT_COACH = { coach, chain, log, build, editor, ASK, ACOL };   // v0.5 · Home's Health tab uses the same few
if (DATA) { const v = document.getElementById("view"); if (v) v.dataset.v = ""; route(); }
})();
</script>

<script>
/* ---------- Orbit v0.4.7 · Upgrade inside the hub ----------
   A hub-only release (latest.json "team_since" is older than theirs): a quick reload, then What's new.
   A team release: the hub's engine runs the update on their own Claude plan (POST /api/upgrade) while the
   Operations panel shows a glowing ring and each step; then What's new. No engine? The old way: a Claude tab. */
(() => {
const SITE = "https://ashahmeetsworld.github.io/ashah-world/os/";
const HI = "#7FD8F0";
const ON_ENGINE = location.protocol === "http:" && location.port === "4777";
const H = { "Content-Type": "application/json", "X-Orbit-Hub": "1" };
const newer = (a, b) => { a = String(a).split(".").map(Number); b = String(b).split(".").map(Number); for (let i = 0; i < Math.max(a.length, b.length); i++) { if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0); } return false; };
const EF = (u, o) => (typeof _f === "function" ? _f : window.fetch)(u, o);  /* past the hub's own /api shim, straight to the engine */
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const markDone = v => { ORBIT.world.orbit = String(v); ORBIT.save(); put("orbit-whatsnew", String(v)); put("orbit-later", String(v)); put("orbit-later-text", ""); };
const ICON = { sun: "☀", mail: "✉", spark: "✦", ring: "◎", door: "⌂" };

window.orbitUpgrade = async function (L, msg, mine) {
  const team = L.team_since && newer(L.team_since, mine);
  let engine = false;
  if (ON_ENGINE) { try { const r = await EF("/api/upgrade/status"); engine = r.ok; } catch (e) {} }
  if (!team) {                                            // A · quick: fresh hub page, then What's new
    document.getElementById("orbitNew")?.remove();
    document.body.insertAdjacentHTML("beforeend", `<div id="upQuick"><span></span>Loading the new Orbit…</div>`);
    if (engine) { try { await EF("/api/upgrade/hub", { method: "POST", headers: H, body: "{}" }); } catch (e) {} }
    markDone(L.version); setTimeout(() => location.reload(), 900); return;
  }
  if (!engine) return openClaude("ops", msg);            // no engine on this computer: the update runs in a Claude tab
  panel(L, mine);
};

/* C · the Operations panel, with B's glowing ring */
function ring(pct) {
  const c = 2 * Math.PI * 54, off = c * (1 - pct / 100);
  return `<svg width="150" height="150" viewBox="0 0 140 140"><circle cx="70" cy="70" r="54" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>
    <circle cx="70" cy="70" r="54" fill="none" stroke="${HI}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)" style="filter:drop-shadow(0 0 8px ${HI});transition:stroke-dashoffset .8s"/>
    <circle cx="${70 + 54 * Math.sin(2 * Math.PI * pct / 100)}" cy="${70 - 54 * Math.cos(2 * Math.PI * pct / 100)}" r="5" fill="#EAFBFF" style="filter:drop-shadow(0 0 6px ${HI})"/>
    <text x="70" y="78" text-anchor="middle" fill="#fff" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="26">${Math.round(pct)}%</text></svg>`;
}
async function panel(L, mine) {
  document.getElementById("orbitNew")?.remove();
  document.getElementById("upPanel")?.remove();
  document.body.insertAdjacentHTML("beforeend", `<div id="upPanel"><div class="uph"><b>Operations</b><span>Updating to v${esc(L.version)}</span><a href="#" id="upHide" title="Close (it keeps going)">–</a></div>
    <div class="upr">${ring(3)}</div><p class="upl">Upgrading your team now. Nothing you've made gets deleted. Keep working: this runs on its own, usually 5 to 10 minutes.</p><ul class="ups"></ul></div>`);
  document.body.insertAdjacentHTML("beforeend", `<a href="#" id="upMini" title="Open the update"><span class="umr">${ring(3)}</span><span class="umt">3%</span></a>`);
  document.getElementById("upHide").onclick = ev => { ev.preventDefault(); show(false); };
  document.querySelector("#upPanel .uph b").onclick = () => show(false);
  document.getElementById("upMini").onclick = ev => { ev.preventDefault(); show(true); };
  let r;
  try { r = await EF("/api/upgrade", { method: "POST", headers: H, body: JSON.stringify({ version: L.version, from: mine, update: SITE + (L.update || "Update-your-Orbit.md") }) }); } catch (e) {}
  if (!r || !r.ok) return fail(r ? await r.text() : "The hub's engine didn't answer.");
  poll(L);
}
/* close the panel: it tucks away and a small glowing counter floats out of the way; click it to open again */
function show(open) {
  document.getElementById("upPanel")?.classList.add("was");
  document.getElementById("upPanel")?.classList.toggle("shut", !open);
  document.getElementById("upMini")?.classList.toggle("on", !open);
}
function draw(st) {
  const p = document.getElementById("upPanel"); if (!p) return;
  const steps = st.steps || [], n = steps.length, pct = st.state === "done" ? 100 : Math.min(92, 6 + n * 11);
  p.querySelector(".upr").innerHTML = ring(pct);
  const m = document.getElementById("upMini"); if (m) { m.querySelector(".umr").innerHTML = ring(pct); m.querySelector(".umt").textContent = Math.round(pct) + "%"; }
  p.querySelector(".ups").innerHTML = steps.map((s, i) => `<li class="${i === n - 1 && st.state !== "done" ? "on" : "ok"}">${i === n - 1 && st.state !== "done" ? "◌" : "✓"} ${esc(s)}</li>`).join("") || `<li class="on">◌ Reading the update</li>`;
}
function fail(t) {
  const p = document.getElementById("upPanel"); if (!p) return;
  p.querySelector(".upl").innerHTML = `Something got in the way: ${esc(String(t || "").slice(0, 200))}. Nothing was changed. <a href="#" id="upRetry">Try again</a> or <a href="#" id="upTab">run it in Claude</a>.`;
  document.getElementById("upRetry").onclick = ev => { ev.preventDefault(); location.reload(); };
  document.getElementById("upTab").onclick = ev => { ev.preventDefault(); p.remove(); _openClaudeOut ? _openClaudeOut("ops", `Upgrade my Orbit. Read the update file in full: ${SITE}Update-your-Orbit.md and follow it exactly, as if I'd dropped it in and typed start.`) : 0; };
}
async function poll(L) {
  let st; try { st = await (await EF("/api/upgrade/status", { cache: "no-store" })).json(); } catch (e) { return setTimeout(() => poll(L), 3000); }
  draw(st);
  if (st.state === "running") return setTimeout(() => poll(L), 2500);
  if (st.state === "done") {
    const p = document.getElementById("upPanel"); p.querySelector(".uph span").innerHTML = `<i style="color:#45E992;font-style:normal">✓ Done</i>`;
    markDone(L.version); put("orbit-later-text", st.later || "");
    setTimeout(() => { p.remove(); document.getElementById("upMini")?.remove(); refreshAsk(L); }, 1400); return;
  }
  fail(st.error);
}

/* Done: a quiet notification in the corner (no takeover). Refresh loads the new Orbit, then What's new shows.
   Closed without refreshing? What's new waits for the next time the hub opens. */
function refreshAsk(L) {
  document.body.insertAdjacentHTML("beforeend", `<div id="upDone" role="status"><span class="udr">${ring(100)}</span><span class="udt"><b>Your team is updated.</b><i>Refresh to load the new Orbit.</i></span><a href="#" id="upRefresh">Refresh</a><a href="#" id="upDoneX" title="Later">×</a></div>`);
  document.getElementById("upRefresh").onclick = ev => { ev.preventDefault(); location.reload(); };
  document.getElementById("upDoneX").onclick = ev => { ev.preventDefault(); document.getElementById("upDone")?.remove(); };
}

/* What's new, in B's glow */
function whatsNew(L, later) {
  const items = (L.whatsnew || []).slice(0, 4);
  document.getElementById("upNew")?.remove();
  document.body.insertAdjacentHTML("beforeend", `<div id="upNew"><div class="unin"><span class="caps">What's new · Orbit v${esc(L.version)}</span><h1>Your team just levelled up.</h1>
    <ul>${items.map(x => `<li><span>${ICON[x.icon] || "✦"}</span><span><b>${esc(x.title)}</b> ${esc(x.line || "")}</span></li>`).join("")}</ul>
    ${later ? `<p class="unlater">One thing for later: ${esc(later)}</p>` : ""}
    <div class="unbtn">${L.show ? `<a href="#" class="go" id="unShow">Show me</a>` : ""}<a href="#" id="unOk">Got it</a></div></div></div>`);
  const close = () => { put("orbit-whatsnew-seen", L.version); document.getElementById("upNew")?.classList.add("out"); setTimeout(() => document.getElementById("upNew")?.remove(), 500); };
  document.getElementById("unOk").onclick = ev => { ev.preventDefault(); close(); };
  const s = document.getElementById("unShow"); if (s) s.onclick = ev => { ev.preventDefault(); close(); location.hash = L.show; };
}
// after a quick reload: What's new once
setTimeout(async () => {
  const v = get("orbit-whatsnew"); if (!v || get("orbit-whatsnew-seen") === v || ORBIT.sample()) return;
  let L; try { L = await (await fetch(SITE + "latest.json", { cache: "no-store" })).json(); } catch (e) { return; }
  if (L && String(L.version) === v) whatsNew(L, get("orbit-later-text") || "");
}, 1200);
})();
</script>

<script>/* Orbit v0.4.9 · helper skills (from A·M·W Hub, 3 Nov 2026) */
/* A·M·W Hub · Helper skills v1.0 (3 Nov 2026)
   One way to work with every helper: a skill is a button for one job. Tap it and a chat opens inside the hub
   to do that job with you. The chat is saved where you tapped it, so you can pick it up again from there.
   Three places skills live:
   1. On each stage of a pipeline (Business Development, Client Success, Gigs and Jobs, Funnel OS's audit, Content Producer's month).
   2. In one dock above the chat bar, with that room's own skills (the old Skills shelf, same skills.json).
   3. Beside pages like Brand DNA, the Codes, the Offer and ICP, and the Operations and Creative Director tabs.
   Loaded last. Wraps flowHTML, roomContent, wire, startChat, chatDraw, docPage, tabPage and route; nothing else changes.
   Chats here are listed in this browser (localStorage "amw-place-chats"); the chat itself lives in Claude Code on this PC. */
(function () {
  if (typeof DEPTS === "undefined") return;

  /* ---------- 1. skills for each stage ---------- */
  const S = (label, prompt) => ({ label, prompt });
  const STAGE_SKILLS = {
    bd: {
      "Discovered": [S("Scan for new people", "Run this week's prospect scan. Ask me where to look first if you need to, then add the people who fit to the Pipeline at Discovered, with my OK."), S("Score the fit", "Score the people at Discovered against the ICP. Tell me who to move on and who to drop.")],
      "Qualified": [S("Find their pain points", "Research the pain points of the people at Qualified, one short line each.")],
      "Signalling": [S("Write the first hellos", "Write the first touch for each person at Signalling, ready for my OK. Nothing gets sent.")],
      "Engaged": [S("Draft the follow-ups", "Draft the next follow-up for each person at Engaged, ready for my OK.")],
      "Shared Value": [S("Build a diagnostic deck", "Build a diagnostic pitch deck outline for one person at Shared Value. Ask me which one.")],
      "Proposal": [S("Draft the proposal", "Draft the proposal for the person at Proposal. Ask me what to offer if you don't know.")],
      "Conversation": [S("Prep my call", "Prep me for my next sales call: who they are, what they need, 3 questions to ask."), S("Debrief a call", "Debrief my last sales call with me, one question at a time, then update the Pipeline with my OK.")],
    },
    cs: {
      "Hand-off": [S("Take the hand-off", "Take the hand-off from Business Development and set up the client in Clients, with my OK.")],
      "Onboarding": [S("Onboard a client", "Run onboarding for the client at Onboarding: the welcome and the kickoff plan.")],
      "Delivery": [S("Check-in", "Draft a check-in for the client at Delivery, ready for my OK.")],
      "Wrap-up": [S("Ask for a testimonial", "Draft the testimonial ask for the client at Wrap-up, ready for my OK.")],
      "Graded": [S("Grade and log lessons", "Grade the engagement and log the lessons, with my OK.")],
    },
    gj: {
      "Shortlisted": [S("Scan for gigs and jobs", "Run the gig and job scan and shortlist the best fits, with my OK."), S("Tailor my resume", "Tailor my resume and cover letter for one shortlisted role. Ask me which one.")],
      "Applied": [S("Follow up", "Draft a follow-up for applications sent 7 or more days ago, ready for my OK.")],
      "Replied": [S("Draft my reply", "Draft my reply to the one that wrote back, ready for my OK.")],
      "Interview": [S("Prep my interview", "Prep me for the interview: the role, likely questions, my best stories.")],
      "Offer": [S("Weigh the offer", "Help me weigh the offer, plainly: what I get, what it costs me, my call.")],
      "Declined": [S("What I learnt", "What can I learn from the ones that said no?")],
      "Closed": [S("What I learnt", "What can I learn from the closed ones?")],
    },
    fo: {
      "Pull numbers": [S("Pull this month's numbers", "Pull this month's funnel numbers, read only, and fill Funnel KPIs with my OK.")],
      "Fill the map": [S("Fill the funnel map", "Fill the five stages of the funnel map from this month's numbers.")],
      "Diagnose": [S("Find the biggest drop", "Find the biggest drop in the funnel this month and say why, plainly.")],
      "Prescribe": [S("Write 2 to 3 fixes", "Write 2 to 3 fixes for the biggest drop. For each: what changes, what stays the same, and what saying no means.")],
      "Approve": [S("Explain each fix", "Explain each fix I'm being asked to approve, in plain words, one at a time.")],
      "Build": [S("Change a landing page", "Let's make an approved landing page change. Show me the plan first."), S("Change an email flow", "Let's make an approved change to an email flow. Show me the plan first.")],
      "Measure": [S("Compare with last month", "Compare this month's funnel with last month: did the fixes work?")],
    },
    cp: {
      "Worksheet": [S("Do the monthly worksheet", "Let's do this month's worksheet. Ask me the riff questions one at a time.")],
      "Macro": [S("Hooks and scripts", "Write hooks and scripts for this month's macro pieces (YouTube and newsletter).")],
      "Waterfall": [S("Waterfall it", "Waterfall this month's macro pieces into Instagram, LinkedIn and X.")],
      "Drafts": [S("Field Notes carousel", "Make a Field Notes carousel from this month's drafts. Ask me which piece."), S("Shot list", "Make a shot list for this month's video.")],
      "Scheduled": [S("Check the calendar", "Check this month's calendar: anything missing, clashing or not approved?")],
    },
  };
  const stageNow = dp => {
    if (dp.id === "cp") { const st = typeof monthState === "function" ? monthState() : null; const i = MS.sel ?? (st ? st.at : 0); return { name: CP_STAGES[i][0], items: [] }; }
    const St = FS[dp.id]; if (!St) return null; const s = St.stages[St.sel]; if (!s) return null;
    return { name: s[0], items: (St.items || []).filter(x => x.st === St.sel).map(x => x.t) };
  };

  /* ---------- 3. skills beside pages and tabs ---------- */
  const PAGE_SKILLS = {
    "doc/brand-dna": ["cd", [S("Sharpen the voice", "Read my last month of posts. Does Brand DNA match how I really talk? Suggest changes, one at a time, for my OK."), S("Score this month's posts", "Score this month's posted work against Brand DNA. One action for any strand under 4."), S("Talk it through", "Let's talk through Brand DNA. What feels out of date?")]],
    "doc/codes": ["cd", [S("Check a piece against the Codes", "Check this piece against the Codes:"), S("Propose a Codes change", "I want to change the Codes. Ask me what and why, then write it up for the change queue.")]],
    "doc/offer": ["bd", [S("Sharpen the offer", "Read the Offer and suggest the 3 changes that would make it easier to say yes to."), S("Check the price", "Check the Offer's price against who it's for. Plainly: too high, too low or right?"), S("Test it on a lead", "Test the Offer against one lead in the Pipeline. Ask me which one.")]],
    "doc/icp": ["bd", [S("Sharpen it", "Read the ICP and sharpen it with me: who's in, who's out, how we score them. One change at a time."), S("Test a lead against it", "Test a lead against the ICP. Ask me which one."), S("Find where they hang out", "Where do the people in the ICP spend their time online and off? Plainly, with where to look first.")]],
    "tab/cd/projects": ["cd", [S("Project brief", "Write a project brief with me. Ask me what the project is first.")]],
    "tab/cd/lab": ["cd", [S("Creative lab", "Open the creative lab for a new campaign idea.")]],
    "tab/cd/pinterest-scan": ["cd", [S("Monthly Pinterest scan", "Run this month's Pinterest scan.")]],
    "tab/ops/sync": ["ops", [S("Sync check", "Run a sync check across the seats, the OS map and Notion.")]],
    "tab/ops/routines": ["ops", [S("Check my routines", "Check the routines: what's overdue, what never runs, what to drop.")]],
    "tab/ops/tool-stack": ["ops", [S("Tool stack review", "Review the tool stack: which seat uses which tool, and what's unused.")]],
    "tab/ops/change-log": ["ops", [S("What changed this week", "Summarise what changed in the OS this week, plainly.")]],
    "tab/ops/paste-backs": ["ops", [S("Turn them into one list", "Turn the waiting paste-back blocks into one clean list for me to approve.")]],
  };
  const pageName = key => { const d = { "doc/brand-dna": "Brand DNA", "doc/codes": "The Codes", "doc/offer": "The Offer", "doc/icp": "ICP" }[key]; if (d) return d; const t = key.split("/")[2] || ""; return t.replace(/-/g, " ").replace(/^./, c => c.toUpperCase()); };

  /* ---------- chats saved where they started ---------- */
  const LS = "amw-place-chats";
  const ledger = () => { try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch (e) { return []; } };
  const saveLedger = L => { try { localStorage.setItem(LS, JSON.stringify(L.slice(0, 300))); } catch (e) {} };
  const chatsAt = place => ledger().filter(c => c.place === place && c.msgs && c.msgs.length).sort((a, b) => b.at - a.at);
  const ago = t => { const m = Math.round((Date.now() - t) / 6e4); return m < 2 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) === 1 ? "yesterday" : Math.round(m / 1440) + " days ago"; };

  const IS_ORBIT = typeof ORBIT !== "undefined";  // Orbit has its own side panel for chats
  let PENDING = null;
  if (!IS_ORBIT) startChat = function (skill, text) {
    CHAT = { skill, sid: null, msgs: [], draft: text || "", back: location.hash || "#home" };
    if (PENDING) { Object.assign(CHAT, PENDING, { cid: "c" + Date.now().toString(36) }); PENDING = null; }
    saveChat(); location.hash = "#chat"; if (location.hash === "#chat") route();
  };
  function runAt(place, placeLabel, it, extra) {
    if (!it) return;
    PENDING = { place, placeLabel, title: it.label, back: "#" + (location.hash.replace("#", "") || "home") };
    const text = (it.prompt || "") + (extra ? "\n\n" + extra : "");
    if (typeof runSkill === "function" && (it.skill === "amw-mentor" || it.skill === "amw-advisory-board")) { PENDING = null; return runSkill(it); }
    startChat(it.skill, text);
  }
  function resume(cid) {
    const c = ledger().find(x => x.cid === cid); if (!c) return;
    if (window.scResume) return window.scResume(c);
    CHAT = { skill: c.skill, sid: c.sid, msgs: c.msgs, draft: "", back: location.hash || c.back, cid: c.cid, place: c.place, placeLabel: c.placeLabel, title: c.title };
    saveChat(); location.hash = "#chat"; if (location.hash === "#chat") route();
  }
  const _chatDraw = chatDraw;
  if (!IS_ORBIT) chatDraw = function (view) {
    _chatDraw(view);
    const C = CHAT; if (!C || !C.cid) return;
    if (C.msgs.length) { const L = ledger().filter(x => x.cid !== C.cid); L.unshift({ cid: C.cid, place: C.place, placeLabel: C.placeLabel, back: C.back, title: C.title, skill: C.skill, sid: C.sid, msgs: C.msgs, at: Date.now() }); saveLedger(L); }
    const m = view.querySelector(".lmsgs");
    if (m && !view.querySelector(".hs-strip")) m.insertAdjacentHTML("beforebegin", `<div class="hs-strip"><span class="caps">✦ ${esc(C.title || "Skill")}</span><span>Saved under ${esc(C.placeLabel || "")}</span></div>`);
  };

  /* ---------- small builders ---------- */
  const chipBtn = (place, i, it) => `<button class="hs-sk" data-hs="${esc(place)}|${i}" title="${esc(it.prompt || "")}">${esc(it.label)}</button>`;
  const chatList = (place, max = 3) => { const cs = chatsAt(place); if (!cs.length) return ""; return `<div class="hs-chats"><span class="caps">Chats here</span>${cs.slice(0, max).map(c => `<button class="hs-chat" data-hsc="${esc(c.cid)}"><b>${esc(c.title || "Chat")}</b><em>${esc(ago(c.at))}</em></button>`).join("")}</div>`; };
  const REG = {}; // place -> { label, skills:[{label,skill,prompt}], extra }

  /* stage skills inside the Now card */
  const _flowHTML = flowHTML;
  flowHTML = function (dp) {
    let html = _flowHTML(dp);
    html = stripShelf(html);
    const map = STAGE_SKILLS[dp.id], now = stageNow(dp); if (!map || !now) return html;
    const list = (map[now.name] || []).map(x => Object.assign({ skill: dp.skill }, x));
    const place = `stage/${dp.id}/${slug(now.name)}`, label = `${dp.name} › ${now.name}`;
    REG[place] = { label, skills: list, extra: `Where we are: ${dp.name}, at ${now.name}.${now.items.length ? " Here now: " + now.items.slice(0, 12).join(", ") + "." : ""}` };
    if (!list.length && !chatsAt(place).length) return html;
    const block = `<div class="hs-stage"><span class="caps">Skills for ${esc(now.name)}</span><div class="hs-row">${list.map((it, i) => chipBtn(place, i, it)).join("")}</div>${chatList(place)}</div>`;
    const at = html.indexOf('<div class="pills" style="margin-top:16px">');
    return at < 0 ? html : html.slice(0, at) + block + html.slice(at);
  };
  /* the old Skills shelf card moves to the dock */
  function stripShelf(html) { return html.replace(/<div class="card"[^>]*><div class="k"><svg[\s\S]*?<\/svg><span class="caps">Skills<\/span>[\s\S]*?<\/form><\/div>/, ""); }
  const _roomContent = roomContent;
  roomContent = function (dp) { return stripShelf(_roomContent(dp)); };

  /* ---------- 2. the dock above the chat bar ---------- */
  function dockFor(h) {
    const [top, a, b] = h.split("/");
    if (top === "room") { const dp = dpBy(a); if (!dp) return null; return { place: "room/" + dp.id, label: dp.name, shelf: dp.id, def: dp.skill, skills: ((DATA.skills || {})[dp.id] || []) }; }
    if (top === "tab") { const k = `tab/${a}/${b}`, dp = dpBy(a); const own = (PAGE_SKILLS[k] || [null, []])[1].map(x => Object.assign({ skill: dp ? dp.skill : "amw-operations" }, x)); return dp ? { place: k, label: `${dp.name} › ${pageName(k)}`, skills: own.length ? own : ((DATA.skills || {})[dp.id] || []), def: dp.skill } : null; }
    return null;
  }
  function drawDock() {
    document.getElementById("hs-dock")?.remove(); document.body.classList.remove("hs-docked");
    if (!DATA || DATA.setup) return;
    const h = location.hash.replace("#", "") || "home", D = dockFor(h); if (!D || !D.skills.length && !D.shelf) return;
    REG[D.place] = { label: D.label, skills: D.skills };
    const chats = chatsAt(D.place);
    document.body.insertAdjacentHTML("beforeend", `<div id="hs-dock"><span class="caps">Skills</span>${D.skills.map((it, i) => `<span class="hs-d">${chipBtn(D.place, i, it)}${D.shelf ? `<i class="hs-x" data-hsx="${i}" title="Take off">×</i>` : ""}</span>`).join("")}
      ${D.shelf ? `<button class="hs-sk hs-add" data-hsadd title="Add a skill">+</button>` : ""}${chats.length ? `<button class="hs-sk hs-past" data-hspast>Past chats · ${chats.length}</button>` : ""}
      ${D.shelf ? `<form class="hs-form"><input name="label" placeholder="Button name" required><input name="prompt" placeholder="What should it do?"><button class="pill on">Save</button></form>` : ""}
      ${chats.length ? `<div class="hs-pop">${chatList(D.place, 8)}</div>` : ""}</div>`);
    document.body.classList.add("hs-docked");
    const dock = document.getElementById("hs-dock"); wireHS(dock);
    dock.querySelector("[data-hsadd]")?.addEventListener("click", () => dock.classList.toggle("adding"));
    dock.querySelector("[data-hspast]")?.addEventListener("click", () => dock.classList.toggle("past"));
    dock.querySelectorAll("[data-hsx]").forEach(x => x.onclick = () => { if (!x.dataset.sure) { x.dataset.sure = 1; x.textContent = "remove?"; return; } DATA.skills[D.shelf].splice(+x.dataset.hsx, 1); saveSkills(); setTimeout(drawDock, 300); });
    const f = dock.querySelector(".hs-form");
    if (f) f.onsubmit = ev => { ev.preventDefault(); const v = Object.fromEntries(new FormData(f)); DATA.skills = DATA.skills || {}; (DATA.skills[D.shelf] = DATA.skills[D.shelf] || []).push({ label: v.label.trim(), skill: D.def, prompt: (v.prompt || "").trim() }); saveSkills(); setTimeout(drawDock, 300); };
  }

  /* ---------- 3. pages: skills and chats under the page head ---------- */
  function pageBlock(key) {
    const P = PAGE_SKILLS[key]; if (!P) return "";
    const dp = dpBy(P[0]), list = P[1].map(x => Object.assign({ skill: dp.skill }, x)), label = pageName(key);
    REG[key] = { label: `${dp.name} › ${label}`, skills: list, extra: `We're working on the ${label} page.` };
    return `<div class="hs-page enter"><div><span class="caps">Skills for this page</span><div class="hs-row">${list.map((it, i) => chipBtn(key, i, it)).join("")}</div></div>${chatList(key, 4)}</div>`;
  }

  }
  const _wire = wire;
  wire = function (el) { _wire(el); wireHS(el); };
  const _route = route;
  route = function () { _route(); setTimeout(drawDock, 20); };
  window.removeEventListener("hashchange", _route);
  window.addEventListener("hashchange", route);

  /* ---------- look ---------- */
  const css = document.createElement("style");
  css.textContent = `

  .hs-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .hs-stage{margin-top:18px;padding-top:14px;border-top:1px solid var(--h)}
  .hs-chats{margin-top:12px;display:flex;flex-direction:column;gap:2px}.hs-chats .caps{margin-bottom:4px}
  .hs-chat{display:flex;gap:10px;align-items:baseline;text-align:left;padding:6px 0;border-top:1px solid var(--h);cursor:pointer;color:var(--t);background:none;border-left:0;border-right:0;border-bottom:0}
  .hs-chat b{font:italic 400 15.5px var(--serif)}.hs-chat em{margin-left:auto;font-style:normal;font-size:11px;color:var(--s)}.hs-chat:hover b{color:var(--c)}
  .hs-page{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;margin:0 0 22px;padding:16px 20px;border:1px solid var(--b);border-radius:14px;background:var(--g3)}
  .hs-page .hs-chats{margin-top:0}
  #hs-dock{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;width:min(860px,calc(100% - 32px))}
  #hs-dock>.caps{margin-right:4px}
  #hs-dock .hs-sk{background:rgba(8,12,28,.78);backdrop-filter:blur(10px)}
  .hs-d{position:relative;display:inline-flex}.hs-x{position:absolute;right:-6px;top:-8px;font-style:normal;font-size:11px;line-height:1;padding:3px 6px;border-radius:99px;background:rgba(8,12,28,.95);border:1px solid var(--h);color:var(--s);cursor:pointer;opacity:0;transition:opacity .2s}
  .hs-d:hover .hs-x,.hs-x[data-sure]{opacity:1}
  .hs-form,.hs-pop{display:none;position:absolute;bottom:46px;left:50%;transform:translateX(-50%);width:min(420px,100%);padding:14px;border:1px solid var(--b);border-radius:14px;background:rgba(8,12,28,.96);backdrop-filter:blur(14px);flex-direction:column;gap:8px}
  .hs-form input{background:transparent;border:1px solid var(--h);border-radius:8px;padding:8px 10px;color:var(--t);font:13px var(--sans)}

  body.hs-docked main{padding-bottom:190px}
  body.hs-docked .notes{bottom:150px}
  body.in-chat #hs-dock{display:none}
  .hs-strip{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 10px;border-bottom:1px solid var(--h);margin-bottom:10px;font-size:12px;color:var(--s)}.hs-strip .caps{color:var(--c)}
  @media (max-width:760px){.hs-page{grid-template-columns:1fr}#hs-dock{bottom:94px}}`;
  document.head.appendChild(css);

  window.HS = { takePending: () => { const p = PENDING; PENDING = null; return p; }, STAGE_SKILLS, PAGE_SKILLS, REG, chipBtn, chatList, chatsAt, ledger, runAt, resume, wireHS, ago, pageName, stripShelf };
  if (DATA) route();
})();

<script>/* Orbit v0.4.9 · helper rooms (from A·M·W Hub, 3 Nov 2026) */
/* A·M·W Hub · Helper rooms v1.0 (3 Nov 2026)
   Every helper page is entered the same way (the Home wheel turns, then shrinks to the top), and every page
   opens with the same spine: where you are, the helper's name and one line, a Today card, the Ask bar.

<script>/* Orbit v0.4.9 · live page (from A·M·W Hub, 3 Nov 2026) */
/* Orbit v0.4.9 · the page stays beside the chat and updates live.
   Chats already open in Orbit's side panel. Now the page moves over to make room for it (on wide screens),
   and after every reply the hub redraws from your world as it is now: a helper page redraws only its working
   part, so nothing replays its entrance. */
(function () {
  if (typeof orbitRefresh !== "function") return;
  orbitRefresh = async function () {
    try {
      const sels = {}; Object.keys(FS || {}).forEach(k => sels[k] = FS[k].sel);
      DATA = await (await fetch("/api/hub")).json();
      FS = {}; Object.keys(sels).forEach(k => { try { const S = flowState(k); if (sels[k] != null && sels[k] < S.stages.length) S.sel = sels[k]; } catch (e) {} });
      const h = location.hash.replace("#", "") || "home", [top, a] = h.split("/"), dp = top === "room" ? dpBy(a) : null;
      if (dp && window.HR && HR.kind(dp.id)) HR.redraw(dp);
      else { const v = document.getElementById("view"); if (v) v.dataset.v = ""; route(); }
    } catch (e) {}
  };
  // after each reply lands in the panel, redraw the page behind it
  let seen = 0;
  const watch = () => {
    const box = document.querySelector("#oc .ocm"); if (!box || box.dataset.live) return !!box;
    box.dataset.live = 1;
    new MutationObserver(() => {
      const n = box.querySelectorAll(".ocb.ai:not(.think)").length;
      if (n > seen && !box.querySelector(".think")) { seen = n; orbitRefresh(); } else if (n < seen) seen = n;
    }).observe(box, { childList: true });
    return true;
  };
  const t = setInterval(() => { if (watch()) clearInterval(t); }, 800);
  const st = document.createElement("style");
  st.textContent = `@media (min-width:1100px){body:has(#oc.open) main{padding-right:480px;transition:padding .5s}}
  body:has(#oc.open) #ask, body:has(#oc.open) #hs-dock{opacity:0;pointer-events:none}`;
  document.head.appendChild(st);
})();
</script>

  v.querySelectorAll("[data-s]").forEach(b => b.onclick = () => go(+b.dataset.s));
  on("[data-prev]", () => go(Math.max(0, j - 1))); on("[data-next]", () => go(j + 1)); on("[data-today]", () => go(x.i));
  on("[data-add]", () => { adding = true; drawSeason(); const i = document.getElementById("sp-add"); i && i.focus(); });
  on("[data-keep]", b => { const L = slots(j); L[+b.dataset.keep].sug = false; saveSlots(j, L); });
  on("[data-drop]", b => { const L = slots(j); L.splice(+b.dataset.drop, 1); saveSlots(j, L); });
  const inp = document.getElementById("sp-add");
  if (inp) inp.onkeydown = ev => { if (ev.key === "Enter" && inp.value.trim()) { adding = false; saveSlots(j, slots(j).concat([{ t: inp.value.trim(), sug: false }])); } if (ev.key === "Escape") { adding = false; drawSeason(); } };
}
// the Seasons switch sits with Back up and Load
const ob = document.getElementById("orbitBar");
if (ob && !document.getElementById("seasonsBtn")) { ob.insertAdjacentHTML("afterbegin", `<button id="seasonsBtn" title="Build and Live seasons: optional">Seasons</button>`); document.getElementById("seasonsBtn").onclick = () => { location.hash = "#season"; }; }

/* ---------- routing ---------- */
const _routeV5 = route;
route = function () {
  const top = (location.hash.replace("#", "") || "home").split("/")[0];
  bar();
  if (DATA && !DATA.setup && top === "season") {
    navTo("home"); clearTimeout(focusTimer); const v = document.getElementById("view"); v.dataset.v = "season"; SEL = null; adding = false;
    setTint(COL.desk); drawSeason(); setAsk("desk", "your Personal Assistant"); scrollTo(0, 0); return;
  }
  _routeV5();
  lock(); wireDesk();
};
window.removeEventListener("hashchange", _routeV5);
window.addEventListener("hashchange", route);
if (DATA) { const v = document.getElementById("view"); if (v) v.dataset.v = ""; route(); }
})();
</script>
